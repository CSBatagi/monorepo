name: Deploy via Tailscale (Backend and Frontend)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Services to build and update'
        type: choice
        options:
          - all
          - backend
          - frontend
          - none
        default: all
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**/README**'
      - '**/test**'
      - '**/Test**'

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend-nextjs: ${{ steps.changes.outputs.frontend-nextjs }}
      docker-compose: ${{ steps.changes.outputs.docker-compose }}
      config_data: ${{ steps.changes.outputs.config_data }}
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICE="${{ inputs.service }}"
            MIGRATIONS="${{ inputs.run_migrations }}"
            if [[ "$SERVICE" == "all" || "$SERVICE" == "backend" ]]; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi
            if [[ "$SERVICE" == "all" || "$SERVICE" == "frontend" ]]; then
              echo "frontend-nextjs=true" >> $GITHUB_OUTPUT
            else
              echo "frontend-nextjs=false" >> $GITHUB_OUTPUT
            fi
            if [[ "$SERVICE" == "all" ]]; then
              echo "docker-compose=true" >> $GITHUB_OUTPUT
              echo "config_data=true" >> $GITHUB_OUTPUT
            else
              echo "docker-compose=false" >> $GITHUB_OUTPUT
              echo "config_data=false" >> $GITHUB_OUTPUT
            fi
            if [[ "$MIGRATIONS" == "true" || "$SERVICE" == "all" ]]; then
              echo "migrations=true" >> $GITHUB_OUTPUT
            else
              echo "migrations=false" >> $GITHUB_OUTPUT
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              DIFF_RANGE="$BEFORE HEAD"
            else
              DIFF_RANGE="HEAD~1 HEAD"
            fi
            DIFF_FILES=$(git diff --name-only $DIFF_RANGE 2>/dev/null || echo "")

            BACKEND_CHANGED=$(echo "$DIFF_FILES" | grep -q '^backend/' && echo 'true' || echo 'false')
            FRONTEND_CHANGED=$(echo "$DIFF_FILES" | grep -q '^frontend-nextjs/' && echo 'true' || echo 'false')
            COMPOSE_CHANGED=$(echo "$DIFF_FILES" | grep -qE '^(docker-compose\.yml|Caddyfile)' && echo 'true' || echo 'false')
            CONFIG_CHANGED=$(echo "$DIFF_FILES" | grep -qE '^frontend-nextjs/public/data/(players|season_start)\.json$' && echo 'true' || echo 'false')
            MIGRATIONS_CHANGED=$(echo "$DIFF_FILES" | grep -qE '^(backend/migrations/|ops/backend/run-migrations\.sh)' && echo 'true' || echo 'false')

            echo "backend=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
            echo "frontend-nextjs=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
            echo "docker-compose=$COMPOSE_CHANGED" >> $GITHUB_OUTPUT
            echo "config_data=$CONFIG_CHANGED" >> $GITHUB_OUTPUT
            echo "migrations=$MIGRATIONS_CHANGED" >> $GITHUB_OUTPUT

            echo "Detected changes (range: $DIFF_RANGE):"
            echo "  backend: $BACKEND_CHANGED"
            echo "  frontend-nextjs: $FRONTEND_CHANGED"
            echo "  docker-compose: $COMPOSE_CHANGED"
            echo "  config_data: $CONFIG_CHANGED"
            echo "  migrations: $MIGRATIONS_CHANGED"
          fi

  build-backend:
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: check-changes
    if: needs.check-changes.outputs.frontend-nextjs == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend-nextjs
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-nextjs
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check-changes, build-backend, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_HOST_SSH_PK }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
          Host deploy-target
            HostName ${{ secrets.PI_HOST }}
            User ${{ secrets.PI_USER || 'clawd' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Create all secret files
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" > .dns_secrets

          echo "MATCHMAKING_TOKEN=${{ secrets.AUTH_TOKEN }}" > .frontend_secrets
          echo "AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}" >> .frontend_secrets
          echo "SERVERACPASS=${{ secrets.SERVERACPASS }}" >> .frontend_secrets
          echo "STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}" >> .frontend_secrets
          echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .frontend_secrets
          echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> .frontend_secrets
          echo "VAPID_SUBJECT=mailto:csbatagi@gmail.com" >> .frontend_secrets
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .frontend_secrets

          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .backend_secrets
          echo "AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}" >> .backend_secrets
          echo "DB_USER=${{ secrets.DB_USER }}" >> .backend_secrets
          echo "RCON_PASSWORD=${{ secrets.RCON_PASSWORD }}" >> .backend_secrets

          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .my_sql_secrets
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .my_sql_secrets
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .my_sql_secrets

          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .pg_secrets
          echo "POSTGRES_READONLY_PASSWORD=${{ secrets.POSTGRES_READONLY_PASSWORD }}" >> .pg_secrets
          echo "CSDM_ANALYZER_PASSWORD=${{ secrets.CSDM_ANALYZER_PASSWORD }}" >> .pg_secrets

          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Prepare directories and copy files
        run: |
          # Create directory structure on host
          ssh deploy-target "mkdir -p /srv/csbatagi/frontend-nextjs/public/data"

          # Copy all config and secret files
          scp \
            ./Caddyfile \
            ./docker-compose.yml \
            ./ops/cs2/game-ssh-known-hosts \
            ./.dns_secrets \
            ./.backend_secrets \
            ./.frontend_secrets \
            ./.my_sql_secrets \
            ./.pg_secrets \
            ./credentials.json \
            deploy-target:/srv/csbatagi/

          # Copy data files
          scp \
            ./frontend-nextjs/public/data/players.json \
            ./frontend-nextjs/public/data/season_start.json \
            deploy-target:/srv/csbatagi/

          # Move data files to correct locations
          ssh deploy-target "mv /srv/csbatagi/players.json /srv/csbatagi/season_start.json /srv/csbatagi/frontend-nextjs/public/data/"

      - name: Set file permissions on host
        run: |
          ssh deploy-target "chmod 600 /srv/csbatagi/.dns_secrets /srv/csbatagi/.backend_secrets /srv/csbatagi/.frontend_secrets /srv/csbatagi/.my_sql_secrets /srv/csbatagi/.pg_secrets /srv/csbatagi/credentials.json"

      - name: Cleanup local secrets
        run: rm -f .dns_secrets .backend_secrets .frontend_secrets .my_sql_secrets .pg_secrets credentials.json

      - name: Update and start containers
        run: |
          # Always authenticate to ghcr.io so images with pull_policy: always can be fetched/verified
          ssh deploy-target "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          SERVICES_TO_UPDATE=""
          if [[ "${{ needs.check-changes.outputs.backend }}" == "true" ]]; then
            SERVICES_TO_UPDATE="$SERVICES_TO_UPDATE backend"
          fi
          if [[ "${{ needs.check-changes.outputs.frontend-nextjs }}" == "true" ]]; then
            SERVICES_TO_UPDATE="$SERVICES_TO_UPDATE frontend-nextjs"
          fi
          if [[ "${{ needs.check-changes.outputs.docker-compose }}" == "true" ]]; then
            # If docker-compose changed, restart all services
            ssh deploy-target "docker compose -f /srv/csbatagi/docker-compose.yml pull && docker compose -f /srv/csbatagi/docker-compose.yml up -d"
          elif [[ -n "$SERVICES_TO_UPDATE" ]]; then
            # Only update specific services
            ssh deploy-target "docker compose -f /srv/csbatagi/docker-compose.yml pull $SERVICES_TO_UPDATE && docker compose -f /srv/csbatagi/docker-compose.yml up -d $SERVICES_TO_UPDATE"
          else
            ssh deploy-target "docker compose -f /srv/csbatagi/docker-compose.yml up -d"
          fi

      - name: Invalidate stats timestamp if config data changed
        if: needs.check-changes.outputs.config_data == 'true'
        run: |
          ssh deploy-target "docker compose -f /srv/csbatagi/docker-compose.yml exec -T backend bash -c 'rm -f /app/last_timestamp.txt' && docker compose -f /srv/csbatagi/docker-compose.yml restart backend"

      - name: Wait for backend stats warmup
        run: |
          ssh deploy-target "bash -s" <<'EOF'
          for i in $(seq 1 48); do
            if docker compose -f /srv/csbatagi/docker-compose.yml exec -T backend node -e 'fetch("http://127.0.0.1:3000/stats/diagnostics", { cache: "no-store" }).then(r => r.json()).then(d => { const sonmac = Number(d?.counts?.sonmac_dates || d?.counts?.sonmac_all_dates || 0); const night = Number(d?.counts?.night_avg_dates || d?.counts?.night_avg_all_dates || 0); if (sonmac > 0 && night > 0) { console.log(JSON.stringify({ ready: true, sonmac_dates: sonmac, night_avg_dates: night, effectiveDataTimestamp: d.effectiveDataTimestamp, lastGeneratedServerTimestamp: d.lastGeneratedServerTimestamp })); process.exit(0); } console.error(JSON.stringify(d)); process.exit(1); }).catch(e => { console.error(e.message); process.exit(1); })'; then
              exit 0
            fi
            echo "Waiting for backend stats warmup ($i/48)..."
            sleep 5
          done
          echo "Backend stats warmup timed out" >&2
          exit 1
          EOF

      - name: Prewarm frontend stats snapshot
        run: |
          ssh deploy-target "bash -s" <<'EOF'
          for i in $(seq 1 24); do
            if docker compose -f /srv/csbatagi/docker-compose.yml exec -T frontend-nextjs node -e 'const token = process.env.MATCHMAKING_TOKEN; if (!token) { console.error("MATCHMAKING_TOKEN missing in frontend container"); process.exit(1); } fetch("http://127.0.0.1:3000/api/internal/stats/prewarm", { method: "POST", headers: { Authorization: `Bearer ${token}` } }).then(async r => { const text = await r.text(); console.log(text); if (!r.ok) process.exit(1); }).catch(e => { console.error(e.message); process.exit(1); })' && \
               docker compose -f /srv/csbatagi/docker-compose.yml exec -T frontend-nextjs sh -lc 'test -s /app/runtime-data/last_timestamp.txt && test -s /app/runtime-data/sonmac_by_date_all.json && test -s /app/runtime-data/night_avg_all.json'; then
              exit 0
            fi
            echo "Waiting for frontend stats snapshot prewarm ($i/24)..."
            sleep 5
          done
          echo "Frontend stats snapshot prewarm timed out" >&2
          exit 1
          EOF

      - name: Prune old Docker images
        run: |
          ssh deploy-target "docker image prune -af --filter 'until=48h'"

      - name: Deploy automated snapshot backup systemd timer and script
        run: |
          ssh deploy-target "mkdir -p /srv/csbatagi/ops/backup"
          scp ops/backup/backup-to-gcs.sh deploy-target:/srv/csbatagi/ops/backup/backup-to-gcs.sh
          ssh deploy-target "chmod +x /srv/csbatagi/ops/backup/backup-to-gcs.sh"
          scp ops/backup/csbatagi-backup.service ops/backup/csbatagi-backup.timer deploy-target:/tmp/
          ssh deploy-target "sudo mv /tmp/csbatagi-backup.service /tmp/csbatagi-backup.timer /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable --now csbatagi-backup.timer"

      - name: Run database migrations if changed
        if: needs.check-changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # Copy migration files and their runner to host
          scp -r \
            ./backend/migrations \
            ./ops/backend/run-migrations.sh \
            deploy-target:/srv/csbatagi/

          # Run all SQL migrations as the database superuser; a failing migration fails this step
          status=0
          ssh deploy-target "bash /srv/csbatagi/run-migrations.sh" || status=$?

          # Cleanup migration files
          ssh deploy-target "rm -rf /srv/csbatagi/migrations /srv/csbatagi/run-migrations.sh"
          exit $status
