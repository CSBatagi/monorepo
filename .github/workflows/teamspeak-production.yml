name: TeamSpeak production operations

# The website has no TeamSpeak integration. The voice server itself runs as the
# `teamspeak` Compose service and is deployed with the rest of the stack; this
# manual workflow only runs the read-only host and voice-server audit.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only audit of the host and the TeamSpeak voice server
        type: choice
        options: [audit]
        default: audit
        required: true

permissions:
  contents: read

concurrency:
  group: teamspeak-production-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Connect to the deployment network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Configure private deployment access
        env:
          DEPLOY_HOST: ${{ secrets.PI_HOST }}
          DEPLOY_USER: ${{ secrets.PI_USER || 'clawd' }}
          DEPLOY_KEY: ${{ secrets.PI_HOST_SSH_PK }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          folder = pathlib.Path.home() / '.ssh'
          folder.mkdir(mode=0o700, exist_ok=True)
          key = folder / 'teamspeak-deploy-key'
          key.write_text(os.environ['DEPLOY_KEY'].replace('\r\n', '\n').strip() + '\n')
          key.chmod(0o600)
          (folder / 'config').write_text('Host teamspeak-target\n  HostName ' + os.environ['DEPLOY_HOST'] + '\n  User ' + os.environ['DEPLOY_USER'] + '\n  IdentityFile ' + str(key) + '\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n')
          PY
      - name: Copy reviewed operation helper
        run: |
          ssh teamspeak-target 'umask 077; mkdir -p /srv/csbatagi/.csbatagi-teamspeak-ops'
          scp ops/teamspeak/inspect-production.py teamspeak-target:/srv/csbatagi/.csbatagi-teamspeak-ops/
      - name: Read-only production audit
        if: inputs.operation == 'audit'
        run: ssh teamspeak-target 'timeout 60s python3 /srv/csbatagi/.csbatagi-teamspeak-ops/inspect-production.py'
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/teamspeak-deploy-key ~/.ssh/config
