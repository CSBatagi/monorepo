name: TeamSpeak production operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only audit, reviewed production deployment, or live validation
        type: choice
        options: [audit, deploy, verify]
        default: audit
        required: true

permissions:
  contents: read

concurrency:
  group: teamspeak-production-operations
  cancel-in-progress: false

jobs:
  build:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend-nextjs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable native ARM image on the CI runner
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/csbatagi/monorepo/${{ matrix.service }}:teamspeak-${{ github.sha }}
            ghcr.io/csbatagi/monorepo/${{ matrix.service }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  operate:
    needs: [build]
    if: always() && (inputs.operation != 'deploy' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Connect to the deployment network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Configure private deployment access
        env:
          DEPLOY_HOST: ${{ secrets.PI_HOST }}
          DEPLOY_USER: ${{ secrets.PI_USER || 'clawd' }}
          DEPLOY_KEY: ${{ secrets.PI_HOST_SSH_PK }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          folder = pathlib.Path.home() / '.ssh'
          folder.mkdir(mode=0o700, exist_ok=True)
          key = folder / 'teamspeak-deploy-key'
          key.write_text(os.environ['DEPLOY_KEY'].replace('\r\n', '\n').strip() + '\n')
          key.chmod(0o600)
          (folder / 'config').write_text('Host teamspeak-target\n  HostName ' + os.environ['DEPLOY_HOST'] + '\n  User ' + os.environ['DEPLOY_USER'] + '\n  IdentityFile ' + str(key) + '\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n')
          PY
      - name: Copy reviewed operation helpers
        run: |
          ssh teamspeak-target 'umask 077; mkdir -p ~/.csbatagi-teamspeak-ops'
          scp ops/teamspeak/*.py teamspeak-target:~/.csbatagi-teamspeak-ops/
      - name: Read-only production audit
        if: inputs.operation == 'audit'
        run: ssh teamspeak-target 'timeout 60s python3 ~/.csbatagi-teamspeak-ops/inspect-production.py'
      - name: Pull access for this repository's deployment images
        if: inputs.operation == 'deploy'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh teamspeak-target 'docker login ghcr.io -u ${{ github.actor }} --password-stdin'
      - name: Deploy immutable images and private TeamSpeak configuration
        if: inputs.operation == 'deploy'
        run: |
          ssh teamspeak-target 'python3 ~/.csbatagi-teamspeak-ops/deploy-production.py --revision ${{ github.sha }} --backend-image ghcr.io/csbatagi/monorepo/backend:teamspeak-${{ github.sha }} --frontend-image ghcr.io/csbatagi/monorepo/frontend-nextjs:teamspeak-${{ github.sha }}'
      - name: Validate production authentication and credential boundaries
        if: inputs.operation == 'verify' || inputs.operation == 'deploy'
        run: |
          scp ops/teamspeak/verify-live.cjs teamspeak-target:~/.csbatagi-teamspeak-ops/verify-live.cjs
          ssh teamspeak-target 'python3 ~/.csbatagi-teamspeak-ops/verify-production.py'
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/teamspeak-deploy-key ~/.ssh/config
