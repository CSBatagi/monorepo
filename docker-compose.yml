services:
  ddns:
    image: favonia/cloudflare-ddns:latest
    network_mode: host # This bypasses network isolation and makes IPv6 easier (optional; see below)
    restart: unless-stopped # Restart the updater after reboot
    user: "1000:1000" # Run the updater with specific user and group IDs (in that order).
    # You can change the two numbers based on your need.
    read_only: true # Make the container filesystem read-only (optional but recommended)
    cap_drop: [all] # Drop all Linux capabilities (optional but recommended)
    security_opt: [no-new-privileges:true] # Another protection to restrict superuser privileges (optional but recommended)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DOMAINS=csbatagi.com,db2.csbatagi.com,voice.csbatagi.com # Comma-separated list of domains to update
      - PROXIED=false # Tell Cloudflare to cache webpages and hide your IP (optional)
    env_file:
      - path: .dns_secrets
        required: true
  #DB for matchzy
  # get5db:
  #   image: yobasystems/alpine-mariadb
  #   container_name: get5db
  #   restart: unless-stopped 
  #   environment:
  #     - MYSQL_DATABASE=get5
  #     - MYSQL_CHARSET=utf8mb4
  #     - MYSQL_COLLATION=utf8mb4_general_ci
  #   env_file:
  #     - path: .my_sql_secrets
  #       required: true
  #   ports:
  #     - 3306:3306
  #   volumes:
  #     - /srv/mysql:/var/lib/mysql

  # The ARM website host is outside GCP's private network. Keep RCON private
  # through IAP; this listener is reachable only inside the Docker network.
  # The analyzer connects to loopback on the game VM. An SSH reverse forward
  # carries that connection over IAP into this private Docker network.
  cs2-analysis-db-tunnel:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:159c2b19fee4d45a4ee0d5388f4f6a22d3598b217a26213e9fe3e0387e0d992c
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 192m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp/home
      CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /run/secrets/gcp.json
      CLOUDSDK_CONFIG: /tmp/gcloud
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: "true"
    volumes:
      - ./credentials.json:/run/secrets/gcp.json:ro
      - ./game-ssh-known-hosts:/run/cs2-known-hosts:ro
    tmpfs:
      - /tmp:mode=1777,size=32m
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        umask 077
        mkdir -p "$$HOME/.ssh"
        cp /run/cs2-known-hosts "$$HOME/.ssh/google_compute_known_hosts"
        exec gcloud compute ssh csbatagi@cs2-server \
          --project=esoteric-dryad-256520 --zone=europe-west3-c \
          --tunnel-through-iap --quiet --verbosity=warning \
          --strict-host-key-checking=yes \
          --ssh-key-file="$$HOME/.ssh/google_compute_engine" --ssh-key-expire-after=1h \
          -- -N -R 127.0.0.1:15432:postgres:5432 \
          -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 -o BatchMode=yes -o ConnectTimeout=20
    networks:
      - db2
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 192M

  cs2-rcon-tunnel:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:ee2115362cc5e05064ace2398593dc2489444fda581db3f61410a84c318f3066
    # Deployment credentials are mode 600 and owned by the host's deployment UID.
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /run/secrets/gcp.json
      CLOUDSDK_CONFIG: /tmp/gcloud
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: "true"
    volumes:
      - ./credentials.json:/run/secrets/gcp.json:ro
    tmpfs:
      - /tmp:mode=1777,size=32m
    entrypoint: [gcloud]
    command:
      - compute
      - start-iap-tunnel
      - cs2-server
      - "27015"
      - --project=esoteric-dryad-256520
      - --zone=europe-west3-c
      - --local-host-port=0.0.0.0:27015
      - --iap-tunnel-disable-connection-check
      - --quiet
      - --verbosity=warning
    networks:
      - db2
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    restart: unless-stopped
    mem_limit: 256m
    image: ghcr.io/csbatagi/monorepo/backend:latest  # Using the image from GitHub Container Registry with main branch tag
    pull_policy: always  # Force Docker to pull the latest image every time
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_HOST: postgres # Hostname matches the service name below
      DB_DATABASE: csdm
      CS2_VM_NAME: cs2-server
      CS2_GCP_ZONE: europe-west3-c
      CS2_RCON_HOST: cs2-rcon-tunnel
      CS2_MATCH_DIR: /app/cs2-control
      # Demo analysis production write switch. Keep "false" until the analyzer has been proven on a
      # manually queued demo; then set "true" so finished website matches are analyzed unattended.
      DEMO_AUTO_ANALYZE: "false"
      # Member uploads of demos from other servers (docs/operations/demo-analysis-and-downloads.md).
      # "false" hides the form and refuses new uploads; analysis of uploads always needs an admin.
      DEMO_UPLOADS_ENABLED: "true"
      # "Analiz et" starts the game VM (the analyzer runs there) and closes it again after this many
      # idle minutes with nobody on the server. "false" leaves starting the VM to people.
      DEMO_ANALYSIS_AUTOSTART: "true"
      DEMO_ANALYSIS_IDLE_MINUTES: "15"
      SEASON_START_FILE: /app/config/season_start.json
      PLAYERS_FILE: /app/players.json
      NODE_OPTIONS: "--max-old-space-size=128"
    env_file:
      - path: .backend_secrets
        required: true
      # VAPID keys and other shared secrets
      - path: .frontend_secrets
        required: false
      # Generated privately on the host; normal CI never replaces this file.
      - path: .teamspeak_secrets
        required: false
    volumes:
      - ./credentials.json:/app/../credentials.json
      - ./cs2-control:/app/cs2-control
      # Mount static config files from public/data (single source of truth)
      - ./frontend-nextjs/public/data/season_start.json:/app/config/season_start.json:ro
      - ./frontend-nextjs/public/data/players.json:/app/players.json:ro
    networks:
      - db2
    expose:
      - 3000
    depends_on:
      - postgres  # Ensure the database is started before backend
      - cs2-rcon-tunnel
    deploy:
      resources:
        limits:
          memory: 256M

  frontend-nextjs:
    restart: unless-stopped
    mem_limit: 256m
    image: ghcr.io/csbatagi/monorepo/frontend-nextjs:latest  # Using the image from GitHub Container Registry
    pull_policy: always  # Force Docker to pull the latest image every time
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db2
    expose:
      - 3000
    env_file:
      - path: .frontend_secrets
        required: true
    environment:
      - STATS_DATA_DIR=/app/runtime-data
      - BACKEND_INTERNAL_URL=http://backend:3000
    volumes:
      - nextjs_data:/app/runtime-data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:17  # Match existing data format (was auto-upgraded)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Tuned for 1 GB RAM VM — keep Postgres footprint under ~120 MB
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
      -c max_connections=50
      -c wal_buffers=1MB
      -c checkpoint_completion_target=0.9
    ports:
      - 5432:5432
    networks:
      - db2
    env_file:
      - path: .pg_secrets
        required: true
    volumes:
     - /srv/pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 192M

  caddy:
    image: caddy:latest
    container_name: caddy-reverse-proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db2 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data  # This is the critical one for SSL certificates
    ports:
      - 80:80
      - 443:443
    environment:
      - CADDY_INGRESS_NETWORKS=db2
    
  teamspeak:
    image: teamspeak:latest
    platform: linux/amd64  # No native arm64 image; runs via QEMU emulation
    container_name: teamspeak-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9987:9987/udp"   # Voice (required)
      - "127.0.0.1:10011:10011" # ServerQuery: operator access only; backend uses db2
      - "30033:30033"     # File transfer (optional)
    environment:
      - TS3SERVER_LICENSE=accept
    env_file:
      - path: .teamspeak_server_secrets
        required: false
    volumes:
      - ./teamspeak/data:/var/ts3server
    networks:
      - db2

volumes:
  pgdata:
  caddy_data:  # Only this volume is essential for SSL certificate persistence
  nextjs_data:

networks:
  db2:
    external: true
